<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{admin/layout}">

<div layout:fragment="content">

    <div class="page-title">
        Update Product
    </div>

    <div class="card shadow">

        <div class="card-header">
            Update Product
        </div>

        <div class="card-body">

            <form th:action="@{/dashboard/product/update/{id}(id=${productId})}"
                  th:object="${productUpdateDTO}"
                  method="post">

                <div class="form-group mb-3">

                    <label>Product Name</label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter Product name">

                </div>

                <div class="form-group mb-3">

                    <label>Product quantity</label>

                    <input type="number"
                           th:field="*{quantity}"
                           class="form-control">

                </div>

                <div class="form-group mb-3">

                    <label>Product price</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           class="form-control">

                </div>

                <!-- Trend -->
                <div class="form-group">
                    <label>Product trend</label>

                    <input type="checkbox"
                           th:field="*{trend}">

                    <p th:if="${#fields.hasErrors('trend')}"
                       th:errors="*{trend}"
                       class="text-danger small mt-1">
                    </p>
                </div>

                <!-- Best Seller -->
                <div class="form-group">
                    <label>Product best seller</label>

                    <input type="checkbox"
                           th:field="*{bestSeller}">

                    <p th:if="${#fields.hasErrors('bestSeller')}"
                       th:errors="*{bestSeller}"
                       class="text-danger small mt-1">
                    </p>
                </div>

                <!-- Feature -->
                <div class="form-group">
                    <label>Product feature</label>

                    <input type="checkbox"
                           th:field="*{feature}">

                    <p th:if="${#fields.hasErrors('feature')}"
                       th:errors="*{feature}"
                       class="text-danger small mt-1">
                    </p>
                </div>

                <div class="form-group mb-3">

                    <label>Product discount price</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{discountPrice}"
                           class="form-control">

                </div>

                <div class="form-group mb-3">

                    <label>Product description</label>

                    <textarea th:field="*{description}"
                              class="form-control"></textarea>

                </div>

                <div class="form-group mb-3">

                    <label>Product short description</label>

                    <textarea th:field="*{shortDescription}"
                              class="form-control"></textarea>

                </div>

                <div class="form-group mb-3">

                    <label>Product specification</label>

                    <textarea th:field="*{specification}"
                              class="form-control"></textarea>

                </div>

                <div class="form-group mb-3">

                    <label>Category</label>

                    <select th:field="*{categoryId}"
                            class="form-control">

                        <option value="">Select Category</option>

                        <option th:each="item : ${categories}"
                                th:value="${item.id}"
                                th:text="${item.name}">
                        </option>

                    </select>

                </div>

                <div class="form-group mb-3">

                    <label>Brand</label>

                    <select th:field="*{brandId}"
                            class="form-control">

                        <option value="">Select Brand</option>

                        <option th:each="item : ${brand}"
                                th:value="${item.id}"
                                th:text="${item.name}">
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Update
                </button>

                <a th:href="@{/dashboard/product}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<div layout:fragment="content" class="container-fluid">

    <div class="card shadow mb-4">
        <!-- Cədvəlin üst hissəsi: Başlıq və Create düyməsi -->
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">Categories</h6>
            <a th:href="@{/dashboard/category/create}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> Create Category
            </a>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category, iterStat : ${categories}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${category.name}">Category Name</td>
                        <td>
                            <a th:href="@{/dashboard/category/update/{id}(id=${category.id})}" class="btn btn-sm btn-warning">Update</a>
                            <a th:href="@{/dashboard/category/delete/{id}(id=${category.id})}" class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f9fc;
        }

        /* Ümumi admin hissəsi */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* SOL TƏRƏF */
        .sidebar {
            width: 230px;
            background: #1e3a5f;
            color: white;
            min-height: 100vh;
        }

        /* Logo */
        .sidebar .logo {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #31577f;
        }

        /* Sidebar menyu */
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        /* Hover */
        .sidebar ul li a:hover {
            background: #31577f;
        }

        /* Icon */
        .sidebar ul li a i {
            width: 25px;
        }

        /* ƏSAS HİSSƏ */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        /* YUXARI HİSSƏ */
        .topbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        /* CONTENT */
        .content {
            padding: 30px;
        }

        /* Başlıq */
        .page-title {
            margin-bottom: 25px;
        }

        /* FOOTER */
        .footer {
            padding: 20px;
            text-align: center;
            background: white;
            border-top: 1px solid #ddd;
        }

    </style>
</head>

<body>

<div class="admin-wrapper">

    <!-- ==================== SIDEBAR ==================== -->

    <aside class="sidebar">

        <div class="logo">
            SB ADMIN
        </div>

        <ul>

            <!-- Dashboard -->
            <li>
                <a href="/dashboard">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>
            </li>

            <!-- Category -->
            <li>
                <a href="/dashboard/category">
                    <i class="fa-solid fa-list"></i>
                    Category
                </a>
            </li>

            <!-- Brand -->
            <li>
                <a href="/dashboard/brand">
                    <i class="fa-solid fa-tag"></i>
                    Brand
                </a>
            </li>
            <li>
                <a href="/dashboard/product">
                    <i class="fa-solid fa-tag"></i>
                   Product
                </a>
            </li>

        </ul>

    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->

    <div class="main-content">

        <!-- Topbar -->
        <div class="topbar">

            <strong>
                Admin Dashboard
            </strong>

        </div>

        <!-- Content -->
        <div class="content">

            <section layout:fragment="content">
            </section>

        </div>

        <!-- Footer -->
        <div class="footer">

            Copyright © Ecommerce 2026

        </div>

    </div>

</div>

</body>

</html>

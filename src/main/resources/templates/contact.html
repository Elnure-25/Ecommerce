<!DOCTYPE html>
<html lang="zxx"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf"
      layout:decorate="~{Layout}">

<head>

    <meta charset="UTF-8">

    <meta name="description" content="Ashion Contact">

    <meta name="keywords" content="Ashion, Contact, Ecommerce">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ashion | Contact</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/front/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/font-awesome.min.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/elegant-icons.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/magnific-popup.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/nice-select.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/owl.carousel.min.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/slicknav.min.css}">

    <link rel="stylesheet"
          th:href="@{/front/css/style.css}">

</head>


<body>

<div layout:fragment="content">

    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option">

        <div class="container">

            <div class="row">

                <div class="col-lg-12">

                    <div class="breadcrumb__links">

                        <a th:href="@{/}">
                            <i class="fa fa-home"></i>
                            Home
                        </a>

                        <span>Contact</span>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- Breadcrumb End -->


    <!-- Contact Section Begin -->
    <section class="contact spad">

        <div class="container">

            <div class="row">

                <!-- Contact Information -->
                <div class="col-lg-6 col-md-6">

                    <div class="contact__content">

                        <div class="contact__address">

                            <h5>Contact info</h5>

                            <ul>

                                <li>

                                    <h6>
                                        <i class="fa fa-map-marker"></i>
                                        Address
                                    </h6>

                                    <p>
                                        160 Pennsylvania Ave NW,
                                        Washington, Castle,
                                        PA 16101-5161
                                    </p>

                                </li>


                                <li>

                                    <h6>
                                        <i class="fa fa-phone"></i>
                                        Phone
                                    </h6>

                                    <p>
                                        <span>125-711-811</span>
                                        <span>125-668-886</span>
                                    </p>

                                </li>


                                <li>

                                    <h6>
                                        <i class="fa fa-headphones"></i>
                                        Support
                                    </h6>

                                    <p>
                                        Support.photography@gmail.com
                                    </p>

                                </li>

                            </ul>

                        </div>


                        <!-- Contact Form -->
                        <div class="contact__form">

                            <h5>SEND MESSAGE</h5>

                            <form action="#" method="post">

                                <input type="text"
                                       name="name"
                                       placeholder="Name">

                                <input type="email"
                                       name="email"
                                       placeholder="Email">

                                <input type="text"
                                       name="website"
                                       placeholder="Website">

                                <textarea name="message"
                                          placeholder="Message"></textarea>

                                <button type="submit"
                                        class="site-btn">

                                    Send Message

                                </button>

                            </form>

                        </div>
                        <!-- Contact Form End -->

                    </div>

                </div>
                <!-- Contact Information End -->


                <!-- Google Map -->
                <div class="col-lg-6 col-md-6">

                    <div class="contact__map">

                        <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48158.305462977965!2d-74.13283844036356!3d41.02757295168286!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c2e440473470d7%3A0xcaf503ca2ee57958!2sSaddle%20River%2C%20NJ%2007458%2C%20USA!5e0!3m2!1sen!2sbd!4v1575917275626!5m2!1sen!2sbd"
                                width="100%"
                                height="780"
                                style="border:0"
                                allowfullscreen="">
                        </iframe>

                    </div>

                </div>
                <!-- Google Map End -->

            </div>

        </div>

    </section>
    <!-- Contact Section End -->

</div>


<!-- JS -->

<script th:src="@{/front/js/jquery-3.3.1.min.js}"></script>

<script th:src="@{/front/js/bootstrap.min.js}"></script>

<script th:src="@{/front/js/jquery.magnific-popup.min.js}"></script>

<script th:src="@{/front/js/jquery-ui.min.js}"></script>

<script th:src="@{/front/js/mixitup.min.js}"></script>

<script th:src="@{/front/js/jquery.countdown.min.js}"></script>

<script th:src="@{/front/js/jquery.slicknav.js}"></script>

<script th:src="@{/front/js/owl.carousel.min.js}"></script>

<script th:src="@{/front/js/jquery.nicescroll.min.js}"></script>

<script th:src="@{/front/js/main.js}"></script>

</body>

</html>
